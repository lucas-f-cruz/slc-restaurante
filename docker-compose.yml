services:
  mysql:
    image: mysql:8.0
    container_name: sol-e-lua-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_demo
      MYSQL_DATABASE: sol_e_lua
      MYSQL_USER: soleluac
      MYSQL_PASSWORD: minhasenha123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
